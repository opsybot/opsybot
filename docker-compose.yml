name: opsybot

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OPSYBOT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${OPSYBOT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${OPSYBOT_POSTGRES_DATABASE}
    ports:
      - "127.0.0.1:${OPSYBOT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${OPSYBOT_VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${OPSYBOT_S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${OPSYBOT_S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${OPSYBOT_S3_BUCKET}
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    ports:
      - "127.0.0.1:${OPSYBOT_S3_PORT:-3900}:3900"
      - "127.0.0.1:${OPSYBOT_S3_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pg-data:
  valkey-data:
  garage-data:
