components:
  schemas:
    AlertLink:
      type: object
      required: [kind, label, url]
      properties:
        kind: { type: string, enum: [runbook, dashboard, source] }
        label: { type: string }
        url: { type: string }
    AlertEvent:
      type: object
      required: [id, at, kind, text, result]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        kind: { type: string }
        text: { type: string }
        result: { type: string }
    Alert:
      type: object
      required: [id, dedupKey, title, description, severity, status, source, service, labels, count, startedAt, lastSeenAt, links, timeline, suppressed, payload]
      properties:
        id: { type: string }
        dedupKey: { type: string }
        groupKey: { type: string }
        title: { type: string }
        description: { type: string }
        severity: { type: string, enum: [critical, high, warning] }
        status: { type: string, enum: [open, acked, resolved] }
        source: { type: string }
        service: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        count: { type: integer }
        startedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        ackedBy: { type: string }
        resolveMode: { type: string }
        escalationPolicySlug: { type: string }
        escalation: { $ref: "#/components/schemas/AlertEscalation" }
        suppressed: { type: boolean }
        payload: { type: string }
        links: { type: array, items: { $ref: "#/components/schemas/AlertLink" } }
        timeline: { type: array, items: { $ref: "#/components/schemas/AlertEvent" } }
        children: { type: array, items: { $ref: "#/components/schemas/AlertChild" } }
    AlertChild:
      type: object
      required: [id, title, count, lastSeenAt, status, severity]
      properties:
        id: { type: string }
        title: { type: string }
        count: { type: integer }
        lastSeenAt: { type: string, format: date-time }
        status: { type: string }
        severity: { type: string }
    EscalationHours:
      type: object
      required: [days, startMinute, endMinute, timezone]
      properties:
        days: { type: array, items: { type: integer } }
        startMinute: { type: integer }
        endMinute: { type: integer }
        timezone: { type: string }
    EscalationTarget:
      type: object
      required: [type, ref]
      properties:
        type: { type: string, enum: [person, schedule, team, webhook] }
        ref: { type: string }
    EscalationLane:
      type: object
      required: [id, key, nodes]
      properties:
        id: { type: string }
        key: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/EscalationNode" } }
    EscalationNode:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [level, branch] }
