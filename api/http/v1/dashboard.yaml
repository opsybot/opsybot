                $ref: "#/components/schemas/Problem"
        "409":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/slug-available:
    get:
      operationId: slugAvailable
      summary: Check whether a workspace URL is available
      tags: [auth]
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
