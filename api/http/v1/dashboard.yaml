              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
    SetupRequest:
      type: object
      required: [name, email, password, workspace, timezone]
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }
        workspace: { type: string }
        timezone: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        remember: { type: boolean }
    LoginResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, two_factor_required]
        user:
          $ref: "#/components/schemas/SessionUser"
    SessionUser:
      type: object
      required: [id, name, email, timezone]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        timezone: { type: string }
    Profile:
      type: object
      required: [id, name, email, timezone, twoFactorEnabled]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        timezone: { type: string }
        twoFactorEnabled: { type: boolean }
    Workspace:
      type: object
      required: [id, name, timezone]
      properties:
        id: { type: string }
        name: { type: string }
        timezone: { type: string }
        environment: { type: string }
    WorkspaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    AcceptInviteRequest:
      type: object
      required: [token, name, password, timezone]
      properties:
        token: { type: string }
        name: { type: string }
        password: { type: string }
        timezone: { type: string }
    InvitePreview:
      type: object
      required: [email, workspace, invitedBy, sentAt]
      properties:
        email: { type: string }
        workspace: { type: string }
        invitedBy: { type: string }
        sentAt: { type: string, format: date-time }
    Role:
      type: string
      enum: [admin, member]
    MemberReference:
      type: object
      required: [id, kind, label, detail]
      properties:
        id: { type: string }
        kind: { type: string }
        icon: { type: string }
        label: { type: string }
        detail: { type: string }
    Member:
      type: object
      required: [userId, name, email, role, status, twoFactor, authMethod, deactivated]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [invited, active, deactivated] }
        twoFactor: { type: boolean }
        authMethod: { type: string, enum: [password, sso, invited] }
        deactivated: { type: boolean }
        lastActiveAt: { type: string, format: date-time }
        references:
          type: array
          items: { $ref: "#/components/schemas/MemberReference" }
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    Invite:
      type: object
      required: [userId, email, role, invitedBy, sentAt, expiresAt]
      properties:
        userId: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invitedBy: { type: string }
        sentAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invite" }
    InviteCreated:
      type: object
      required: [invite, acceptUrl]
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        acceptUrl: { type: string }
    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    DeactivateMemberRequest:
      type: object
      required: [replacements]
      properties:
        replacements:
          type: object
          additionalProperties: { type: string }
    UpdateProfileRequest:
      type: object
      required: [name, timezone]
      properties:
        name: { type: string }
        timezone: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }
    Session:
      type: object
      required: [id, createdAt, lastSeenAt, current]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        ip: { type: string }
        userAgent: { type: string }
        current: { type: boolean }
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Session" }
    Channel:
      type: object
      required: [id, type, detail, verified]
      properties:
        id: { type: string }
        type: { type: string, enum: [slack, teams, discord, telegram, ntfy, email, webhook] }
        detail: { type: string }
        verified: { type: boolean }
    ChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Channel" }
    CreateChannelRequest:
      type: object
      required: [type, detail]
      properties:
        type: { type: string, enum: [slack, teams, discord, telegram, ntfy, email, webhook] }
        detail: { type: string }
    TwoFactorEnrollment:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string }
        otpauthUri: { type: string }
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { type: string }
    TwoFactorCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    RecoveryCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string }
    Team:
      type: object
      required: [id, slug, name, memberIds, archived, createdAt]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        memberIds:
          type: array
          items: { type: string }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
    TeamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Team" }
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        memberIds:
          type: array
          items: { type: string }
    UpdateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        memberIds:
          type: array
          items: { type: string }
    Scope:
      type: string
      enum: [incidents:read, incidents:write, alerts:read, alerts:write, schedules:write, policies:write, config:write, audit:read]
    ApiKey:
      type: object
      required: [id, name, kind, scopes, hint, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [personal, workspace] }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        hint: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    ApiKeyList:
      type: object
      required: [personal, workspace]
      properties:
        personal:
          type: array
          items: { $ref: "#/components/schemas/ApiKey" }
        workspace:
          type: array
          items: { $ref: "#/components/schemas/ApiKey" }
    CreateApiKeyRequest:
      type: object
      required: [name, kind, scopes]
      properties:
        name: { type: string }
        kind: { type: string, enum: [personal, workspace] }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
    CreatedApiKey:
      type: object
      required: [key, secret]
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        secret: { type: string }
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
