openapi: 3.0.3
info:
  title: Opsybot Dashboard API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: The service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/setup:
    get:
      operationId: getSetupStatus
      summary: Whether first-run setup is required
      tags: [auth]
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      operationId: setup
      summary: First-run setup (creates the first admin and workspace)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Instance set up and signed in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sign-in result
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
