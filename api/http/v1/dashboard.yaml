openapi: 3.0.3
info:
  title: Opsybot Dashboard API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: The service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/setup:
    get:
      operationId: getSetupStatus
      summary: Whether first-run setup is required
      tags: [auth]
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      operationId: setup
      summary: First-run setup (creates the first admin and workspace)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Instance set up and signed in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sign-in result
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out of the current session
      tags: [auth]
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /me:
    get:
      operationId: getMe
      summary: The signed-in user's profile
      tags: [me]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: Workspaces the signed-in user belongs to
      tags: [workspaces]
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      summary: A single workspace
      tags: [workspaces]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/invite/preview:
    post:
      operationId: previewInvite
      summary: Preview an invitation before accepting
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: Invite preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "400":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/invite/accept:
    post:
      operationId: acceptInvite
      summary: Accept an invitation and sign in
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "200":
          description: Invitation accepted and signed in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "400":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /workspaces/{workspaceId}/members:
    get:
      operationId: listMembers
      summary: List workspace members
      tags: [members]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /workspaces/{workspaceId}/members/invites:
    get:
      operationId: listInvites
      summary: List pending invitations
      tags: [members]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteList" }
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: inviteMember
      summary: Invite a member by email
      tags: [members]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteMemberRequest" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCreated" }
        "400":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /workspaces/{workspaceId}/members/invites/{userId}/resend:
    post:
      operationId: resendInvite
      summary: Resend a pending invitation
      tags: [members]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation resent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCreated" }
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /workspaces/{workspaceId}/members/invites/{userId}:
    delete:
      operationId: revokeInvite
      summary: Revoke a pending invitation
      tags: [members]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invitation revoked
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /workspaces/{workspaceId}/members/{userId}:
    get:
      operationId: getMember
      summary: A single member
      tags: [members]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /workspaces/{workspaceId}/members/{userId}/role:
    put:
      operationId: changeMemberRole
      summary: Change a member's role
      tags: [members]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeRoleRequest" }
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /workspaces/{workspaceId}/members/{userId}/deactivate:
    post:
      operationId: deactivateMember
      summary: Deactivate a member (with reference reassignment)
      tags: [members]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeactivateMemberRequest" }
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /workspaces/{workspaceId}/members/{userId}/reactivate:
    post:
      operationId: reactivateMember
      summary: Reactivate a deactivated member
      tags: [members]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The request failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
    SetupRequest:
      type: object
      required: [name, email, password, workspace, timezone]
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }
        workspace: { type: string }
        timezone: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        remember: { type: boolean }
    LoginResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, two_factor_required]
        user:
          $ref: "#/components/schemas/SessionUser"
    SessionUser:
      type: object
      required: [id, name, email, timezone]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        timezone: { type: string }
    Profile:
      type: object
      required: [id, name, email, timezone, twoFactorEnabled]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        timezone: { type: string }
        twoFactorEnabled: { type: boolean }
    Workspace:
      type: object
      required: [id, name, timezone]
      properties:
        id: { type: string }
        name: { type: string }
        timezone: { type: string }
        environment: { type: string }
    WorkspaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    AcceptInviteRequest:
      type: object
      required: [token, name, password, timezone]
      properties:
        token: { type: string }
        name: { type: string }
        password: { type: string }
        timezone: { type: string }
    InvitePreview:
      type: object
      required: [email, workspace, invitedBy, sentAt]
      properties:
        email: { type: string }
        workspace: { type: string }
        invitedBy: { type: string }
        sentAt: { type: string, format: date-time }
    Role:
      type: string
      enum: [admin, member]
    MemberReference:
      type: object
      required: [id, kind, label, detail]
      properties:
        id: { type: string }
        kind: { type: string }
        icon: { type: string }
        label: { type: string }
        detail: { type: string }
    Member:
      type: object
      required: [userId, name, email, role, status, twoFactor, authMethod, deactivated]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [invited, active, deactivated] }
        twoFactor: { type: boolean }
        authMethod: { type: string, enum: [password, sso, invited] }
        deactivated: { type: boolean }
        lastActiveAt: { type: string, format: date-time }
        references:
          type: array
          items: { $ref: "#/components/schemas/MemberReference" }
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    Invite:
      type: object
      required: [userId, email, role, invitedBy, sentAt, expiresAt]
      properties:
        userId: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invitedBy: { type: string }
        sentAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invite" }
    InviteCreated:
      type: object
      required: [invite, acceptUrl]
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        acceptUrl: { type: string }
    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    DeactivateMemberRequest:
      type: object
      required: [replacements]
      properties:
        replacements:
          type: object
          additionalProperties: { type: string }
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
